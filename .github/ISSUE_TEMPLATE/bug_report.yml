name: Website bug report
description: Report a broken layout, error, or styling bug on neoomsi.com
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a website bug!
  - type: input
    id: url
    attributes:
      label: Page URL
      placeholder: https://neoomsi.com/...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 130 on Windows 11, Safari on macOS, etc.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
